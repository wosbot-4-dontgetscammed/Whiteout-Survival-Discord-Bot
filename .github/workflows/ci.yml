name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  syntax-check:
    name: Python syntax check
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile every Python file
        run: |
          python -m compileall -q cogs main.py

      - name: Verify entrypoint is importable
        run: |
          python -c "import ast, pathlib; ast.parse(pathlib.Path('main.py').read_text())"
          for f in cogs/*.py; do
            python -c "import ast, pathlib; ast.parse(pathlib.Path('$f').read_text())" || exit 1
          done
